  const h=document.createElement("p");h.style.cssText="margin:12px 0 6px;font-weight:700";h.textContent="Historial por día";L.append(h);
  if(!mine.length){const e=document.createElement("p");e.className="empty";e.textContent="Sin movimientos todavía";L.append(e)}else dayBlocks(L,mine,false,true)}
