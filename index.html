<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Anea · Pide tu bebida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f5f0e8;--card:#fbf8f3;--pink:#e3c6cb;--pink-d:#d2a5ae;--rose:#b47a87;--ink:#3d2a2f;--muted:#7a6469;--line:#e2d6cf;color-scheme:only light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#f5f0e8;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 18px 130px}
h1{margin:0 0 4px;line-height:0}
h1 img{width:min(72vw,320px);height:auto}
.tag{font-weight:700;color:var(--rose);margin:0 0 14px}
.lead{margin:0 0 26px;color:var(--muted);font-size:.95rem}
h2{font-size:1.05rem;font-weight:700;margin:28px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--pink-d)}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.t{flex:1}.t b{font-weight:600;display:block}.t small{color:var(--muted)}
button{font:inherit;cursor:pointer}
.pk,.go{background:var(--pink);color:var(--ink);border:0;border-radius:999px;font-weight:700;padding:10px 20px}
.pk:active,.go:active{background:var(--pink-d)}
.go{display:block;width:100%;padding:14px;margin-top:18px;text-align:center;text-decoration:none;font-size:1rem}
.link{background:none;border:0;color:var(--muted);width:100%;padding:12px 0 0;text-decoration:underline}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:10px;background:var(--pink);color:var(--ink);border:2px solid var(--card);border-radius:999px;padding:14px 26px;font-weight:700;font-size:1.05rem;box-shadow:0 6px 18px rgba(61,42,47,.28);white-space:nowrap}
.fab:active{background:var(--pink-d)}
.fab .n{background:var(--rose);color:#fff;border-radius:999px;min-width:24px;height:24px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.fab .n[hidden]{display:none}
dialog{border:0;border-radius:18px;padding:0;width:min(92vw,520px);background:var(--card);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(61,42,47,.5)}
.box{padding:22px}.box h3{margin:0 0 6px;font-size:1.3rem}
fieldset{border:0;padding:0;margin:16px 0 0}
legend{font-weight:700;margin-bottom:8px;padding:0}
.chip{display:inline-block;margin:0 6px 8px 0}
.chip input{position:absolute;opacity:0}
.chip span{display:inline-block;padding:9px 14px;border:1.5px solid var(--pink-d);border-radius:999px;cursor:pointer}
.chip input:checked+span{background:var(--pink);border-color:var(--rose);font-weight:700}
.chip input:focus-visible+span{outline:3px solid var(--rose);outline-offset:2px}
.ln{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ln .t small{display:block}
.ln .q{display:flex;align-items:center;gap:6px}
.ln .q button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--pink-d);background:none;color:var(--ink);font-size:1.1rem}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;padding-top:12px}
label.f{display:block;font-weight:700;margin:16px 0 4px}
input.tx,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--pink-d);background:#fff;color:var(--ink)}
a.go[hidden]{display:none}
.err{color:#a3262d;margin:8px 0 0;min-height:1.2em}
</style>
</head>

let cart=[],cur=null;
const grp=(t,k,o)=>`<fieldset><legend>${t}</legend>${o.map(([v,l,p],i)=>`<label class="chip"><input type="radio" name="${k}" value="${v}"${i?"":" checked"}><span>${l}${p?` +${money(p)}`:""}</span></label>`).join("")}</fieldset>`;
const val=k=>{const e=$(`input[name=${k}]:checked`);return e?e.value:""};
const price=()=>(cur.z?cur.z.find(x=>x[0]===val("z"))[1]:cur.p)+(val("f")?10:0)+(val("l")==="Avena"?10:0)+(val("s")?10:0);
const total=()=>cart.reduce((s,x)=>s+x.p*x.q,0),units=()=>cart.reduce((s,x)=>s+x.q,0);

MENU.forEach(g=>{
  $("#menu").insertAdjacentHTML("beforeend",`<h2>${g.c}</h2>`);
  g.i.forEach(it=>{
    const r=document.createElement("div");r.className="item";
    r.innerHTML=`<div class="t"><b>${it.n}${it.h?"":""}</b><small>${it.d||""}</small></div><button class="pk" aria-label="Elegir ${it.n}${g.c==="Calientes"?" caliente":""}">Elegir</button>`;
    r.querySelector("button").onclick=()=>openCfg(it);
    $("#menu").append(r);
  });
});

function openCfg(it){
  cur=it;let h=`<h3>${it.n}${it.h?" caliente":""}</h3>`;
  if(it.v)h+=grp("Sabor","v",it.v.map(v=>[v,v,0]));
  if(it.z)h+=grp("Tamaño","z",it.z.map(([l,p])=>[l,`${l} · ${money(p)}`,0]));
  if(it.f)h+=grp("Cloud foam","f",[["","Sin cloud foam",0],...FO.map(f=>[f,f,10])]);
  if(!it.x)h+=grp("Leche","l",[["Entera","Entera",0],["Deslactosada","Deslactosada",0],["Avena","Avena",10]]);
  if(it.s)h+=grp("Shot de espresso","s",[["","Sin shot",0],["Shot","Con shot",10]]);
  h+=`<button class="go" id="add"></button><button class="link" id="cx">Cancelar</button>`;
  $("#cfgb").innerHTML=h;
  const up=()=>$("#add").textContent=`Agregar · ${money(price())}`;
  $("#cfgb").onchange=up;up();
  $("#add").onclick=()=>{addItem();$("#cfg").close()};
  $("#cx").onclick=()=>$("#cfg").close();
  $("#cfg").showModal();
}
function addItem(){
  const parts=[val("z"),val("f")&&`cloud foam de ${val("f")}`,val("s")&&"shot de espresso",val("l")&&`leche ${val("l").toLowerCase()}`].filter(Boolean);
  const name=cur.n+(cur.h?" caliente":"")+(val("v")?` ${val("v")}`:"");
  const key=name+"|"+parts.join(",");
  const ex=cart.find(x=>x.key===key);
  if(ex)ex.q++;else cart.push({key,name,opt:parts.join(", "),p:price(),q:1});
  upd();
}
function upd(){
  const u=units();
  $("#count").textContent=u?"Pedir":"Pedir bebidas";
  $("#n").hidden=!u;$("#n").textContent=u;
  $("#sum").textContent=u?money(total()):"";
}
function lines(el,edit){
  el.innerHTML="";
  cart.forEach(x=>{
    const d=document.createElement("div");d.className="ln";
    d.innerHTML=`<div class="t"><b></b><small></small></div>`+(edit?`<div class="q"><button aria-label="Quitar uno">−</button><span>${x.q}</span><button aria-label="Agregar uno">+</button></div>`:`<span>${x.q} ×</span>`)+`<span>${money(x.p*x.q)}</span>`;
    d.querySelector("b").textContent=x.name;d.querySelector("small").textContent=x.opt;
    if(edit){const [m,p]=d.querySelectorAll("button");
      m.onclick=()=>{x.q--;if(!x.q)cart=cart.filter(y=>y!==x);upd();cart.length?lines(el,1):$("#dlg").close()};
      p.onclick=()=>{x.q++;upd();lines(el,1)};}
    el.append(d);
  });
  el.insertAdjacentHTML("beforeend",`<div class="tot"><span>Total</span><span>${money(total())}</span></div>`);
}
$("#deliv").innerHTML=grp("¿Dónde te lo entregamos?","e",[["CBTis","CBTis",0],["Prepa","Prepa",0],["Otros","Otros",0]]);
$("#deliv").onchange=()=>{$("#addrw").hidden=val("e")!=="Otros"};
$("#open").onclick=()=>{if(!units()){$("#menu").scrollIntoView({behavior:"smooth"});return}$("#review").hidden=false;$("#done").hidden=true;$("#err").textContent="";lines($("#lines"),1);$("#dlg").showModal()};
$("#back").onclick=()=>$("#dlg").close();
$("#send").onclick=async()=>{
  const name=$("#name").value.trim(),ph=$("#phone").value.trim(),e=val("e"),ad=$("#addr").value.trim(),note=$("#note").value.trim(),err=m=>$("#err").textContent=m;
  if(!name){err("Escribe tu nombre para poder llamarte cuando esté listo.");$("#name").focus();return}
  if(ph.replace(/\D/g,"").length<10){err("Escribe tu teléfono a 10 dígitos para poder contactarte.");$("#phone").focus();return}
  if(e==="Otros"&&!ad){err("Escribe la dirección de tu casa.");$("#addr").focus();return}
  const dest=e==="Otros"?ad:e,btn=$("#send");
  err("");btn.disabled=true;btn.textContent="Enviando…";
  const order={name,phone:ph,dest,note,total:total(),items:cart.map(x=>({name:x.name,opt:x.opt,q:x.q,p:x.p}))};
  let t=`Hola, soy ${name}. Quiero pedir:\n`;
  cart.forEach(x=>t+=`- ${x.q} × ${x.name}${x.opt?` (${x.opt})`:""}: ${money(x.p*x.q)}\n`);
  t+=`Total: ${money(total())}\nEntrega: ${dest}\nTeléfono: ${ph}`;
  if(note)t+=`\nIndicaciones: ${note}`;
  let ok=false;
  try{ok=await Promise.race([window.saveOrder(order),new Promise((_,r)=>setTimeout(r,12000))])}catch(x){ok=false}
  btn.disabled=false;btn.textContent="Enviar pedido";
  lines($("#doneL"),0);
  if(ok){$("#doneT").textContent=`¡Pedido enviado, ${name}!`;$("#doneP").textContent=`Ya lo recibimos. Te llamamos por tu nombre cuando esté listo. Entrega: ${dest}.`;$("#wa").hidden=true}
  else{$("#doneT").textContent="No pudimos enviar tu pedido";$("#doneP").textContent="Mándalo por WhatsApp para que lo recibamos.";$("#wa").textContent="Enviar por WhatsApp";$("#wa").href=`https://wa.me/${WA}?text=${encodeURIComponent(t)}`;$("#wa").hidden=false}
  $("#review").hidden=true;$("#done").hidden=false;
};
$("#new").onclick=()=>{cart=[];upd();$("#note").value="";$("#dlg").close();window.scrollTo({top:0})};
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyC06tHtumXz4YOimZHMMv7CLaE9bJD5Xh8",authDomain:"anea-pedidos.firebaseapp.com",projectId:"anea-pedidos",appId:"1:940121031481:web:78b3989fd086354de35ee8"}));
window.saveOrder=async o=>{await addDoc(collection(db,"orders"),{name:o.name,items:o.items,phone:o.phone,total:o.total,dest:o.dest,note:o.note,status:"nuevo",createdAt:serverTimestamp()});return true};
</script>
